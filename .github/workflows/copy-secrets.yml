name: Copy secrets to CameraAddressApp
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
    - name: Copy secrets
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        CERT: ${{ secrets.DIST_CERT_BASE64 }}
        PASS: ${{ secrets.DIST_CERT_PASSWORD }}
        KPASS: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        echo "$CERT" | gh secret set DIST_CERT_BASE64 -R snarfnet/CameraAddressApp
        echo "$PASS" | gh secret set DIST_CERT_PASSWORD -R snarfnet/CameraAddressApp
        echo "$KPASS" | gh secret set KEYCHAIN_PASSWORD -R snarfnet/CameraAddressApp
        echo "All secrets copied successfully"
